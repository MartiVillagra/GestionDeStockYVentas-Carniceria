<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apertura y Cierre de Caja</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

  <aside class="sidebar p-3">
    <h2 class="text-2xl font-bold mb-4 text-center">🥩 Carnicería</h2>
    <nav class="flex flex-col gap-2">
      <a href="index.html">💰 TPV</a>
      <a href="stock.html">📦 Stock</a>
      <a href="movimientos.html">💸 Movimientos Caja</a>
      <a href="inicio_cierre.html" class="active">🔐 Apertura / Cierre</a>
      <a href="empleados.html">👥 Empleados</a>
      <a href="sueldos.html">🧾 Sueldos</a>
      <a href="resumen.html">📊 Resumen</a>
    </nav>
  </aside>

  <main class="main-content">
    <h1 class="text-3xl font-bold mb-4">🔐 Apertura y Cierre de Caja</h1>

    <div class="row">
      <!-- Apertura -->
      <div class="col-md-6">
        <div class="card shadow mb-4">
          <div class="card-header bg-success text-white fw-bold">Apertura de Caja</div>
          <div class="card-body">
            <form id="apertura-form">
              <label>Monto Inicial ($)</label>
              <input type="number" id="monto_apertura" class="form-control mb-3" step="0.01" required>
              <button class="btn btn-success w-100">Abrir Caja</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Cierre -->
      <div class="col-md-6">
        <div class="card shadow mb-4">
          <div class="card-header bg-danger text-white fw-bold">Cierre de Caja</div>
          <div class="card-body">
            <button id="btn-cierre" class="btn btn-danger w-100 mb-3">Cerrar Caja</button>
            <div id="resumen-cierre" class="text-center text-gray-600"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/index.js"></script>
</body>
</html>
