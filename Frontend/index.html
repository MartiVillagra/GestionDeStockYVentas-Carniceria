<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnicería - Terminal Punto de Venta (TPV)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .product-card {
            transition: all 0.15s ease-in-out;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
        }
        .header-bg {
            background-color: #A30000; /* Rojo oscuro de carnicería */
        }
        .btn-pay {
            background-color: #28a745;
            border-color: #28a745;
            color: white;
        }
        .btn-pay:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }
        .cart-header {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <header class="header-bg p-3 shadow-md">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <h1 class="text-xl font-bold text-white mb-0">🥩 Punto de Venta Carnicería</h1>
            <div>
                <a href="cierre.html" class="btn btn-sm btn-outline-light me-2">Gestión de Caja</a>
                <a href="stock.html" class="btn btn-sm btn-light">Stock</a>
            </div>
        </div>
    </header>

    <main class="container-fluid my-4">
        <div class="row">
            <!-- Columna de Productos (Izquierda) -->
            <div class="col-lg-8">
                <div class="p-3 bg-white shadow-lg rounded-lg">
                    <h2 class="text-2xl font-bold mb-4 text-gray-700">🛒 Productos Disponibles</h2>
                    <div class="row g-3" id="product-list">
                        <!-- Las tarjetas de productos se cargarán aquí con JavaScript -->
                        <div class="col-12 text-center text-gray-500 py-5">Cargando productos...</div>
                    </div>
                </div>
            </div>

            <!-- Columna de Carrito y Pago (Derecha) -->
            <div class="col-lg-4">
                <div class="card shadow-lg">
                    <div class="card-header cart-header">
                        <h2 class="text-xl font-bold mb-0 text-gray-800">CARRITO DE VENTA</h2>
                    </div>
                    <div class="card-body p-0">
                        <!-- Lista de Ítems del Carrito -->
                        <ul class="list-group list-group-flush" id="cart-items">
                            <li class="list-group-item text-center text-gray-500 py-4" id="empty-cart-message">
                                El carrito está vacío. Agregue productos.
                            </li>
                        </ul>
                        
                        <!-- Resumen y Total -->
                        <div class="p-3 border-top">
                            <div class="d-flex justify-content-between text-lg font-semibold">
                                <span>TOTAL:</span>
                                <span id="cart-total" class="text-red-700">$0.00</span>
                            </div>
                        </div>
                    </div>

                    <!-- Panel de Pago -->
                    <div class="card-footer bg-gray-50">
                        <h3 class="text-lg font-semibold mb-2">Método de Pago</h3>
                        <div class="d-flex mb-3 gap-2">
                            <!-- Los IDs de los botones coinciden con el método de pago en la API -->
                            <button class="btn btn-primary flex-grow-1" id="btn-payment-efectivo">Efectivo</button>
                            <button class="btn btn-outline-secondary flex-grow-1" id="btn-payment-tarjeta">Tarjeta</button>
                            <button class="btn btn-outline-secondary flex-grow-1" id="btn-payment-transferencia">Transferencia</button>
                        </div>
                        <button class="btn btn-pay w-full py-3 text-xl font-bold shadow-md" id="btn-finalize-sale" disabled>
                            FINALIZAR VENTA ($0.00)
                        </button>
                        <button class="btn btn-outline-danger w-full mt-2" id="btn-clear-cart">
                            Limpiar Carrito
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Modal de Cantidad (para productos que se pesan o cuentan) -->
    <div class="modal fade" id="quantityModal" tabindex="-1" aria-labelledby="quantityModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content rounded-xl shadow-2xl">
                <div class="modal-header bg-gray-50 border-b">
                    <h5 class="modal-title font-bold text-gray-800" id="quantityModalLabel">Ingresar Cantidad</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="mb-1">Producto: <strong id="modal-product-name" class="text-lg text-red-700"></strong></p>
                    <p class="mb-3 text-sm text-gray-600">Precio: <strong id="modal-product-price"></strong> por <span id="modal-unit"></span></p>
                    
                    <div class="mb-3">
                        <label for="input-quantity" class="form-label text-base font-medium" id="input-quantity-label">Cantidad (KG):</label>
                        <input type="number" step="0.01" class="form-control form-control-lg rounded-lg focus:ring-red-500" id="input-quantity" value="1.00" min="0.01">
                        <p class="text-xs text-gray-500 mt-1" id="modal-stock-info">Stock disponible: 50.00 KG</p>
                    </div>
                </div>
                <div class="modal-footer bg-gray-50 border-t">
                    <button type="button" class="btn btn-secondary rounded-lg" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-pay rounded-lg" id="btn-add-to-cart">Añadir al Carrito</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/index.js"></script> 
</body>
</html>
