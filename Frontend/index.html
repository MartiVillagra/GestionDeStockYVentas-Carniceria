<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TPV - Carnicería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
  <!-- Sidebar -->
  <aside class="sidebar p-3">
    <h2 class="text-2xl font-bold mb-4 text-center">🥩 Carnicería</h2>
    <nav class="flex flex-col gap-2">
      <a href="index.html" class="active">💰 TPV</a>
      <a href="stock.html">📦 Stock</a>
      <a href="movimientos.html">💸 Movimientos Caja</a>
      <a href="inicio_cierre.html">🔐 Apertura / Cierre</a>
      <a href="empleados.html">👥 Empleados</a>
      <a href="sueldos.html">🧾 Sueldos</a>
      <a href="resumen.html">📊 Resumen</a>
    </nav>
  </aside>

  <!-- Contenido principal -->
  <main class="main-content">
    <h1 class="text-3xl font-bold mb-4">💰 Terminal Punto de Venta</h1>

    <div class="row">
      <!-- Productos -->
      <div class="col-lg-8">
        <div class="p-3 bg-white shadow rounded-lg">
          <h2 class="text-2xl font-bold mb-4 text-gray-700">🛒 Productos Disponibles</h2>
          <div class="row g-3" id="product-list">
            <div class="col-12 text-center text-gray-500 py-5">Cargando productos...</div>
          </div>
        </div>
      </div>

      <!-- Carrito -->
      <div class="col-lg-4">
        <div class="card shadow">
          <div class="card-header bg-gray-50">
            <h2 class="text-xl font-bold mb-0">CARRITO</h2>
          </div>

          <ul class="list-group list-group-flush" id="cart-items">
            <li class="list-group-item text-center text-gray-500 py-4">Vacío.</li>
          </ul>

          <div class="card-footer bg-gray-50">
            <div class="d-flex justify-content-between mb-2 font-bold text-lg">
              <span>Total:</span>
              <span id="cart-total" class="text-red-700">$0.00</span>
            </div>

            <!-- Botones de forma de pago -->
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-outline-secondary flex-grow-1" id="btn-payment-efectivo" onclick="seleccionarPago('efectivo')">Efectivo</button>
              <button class="btn btn-outline-secondary flex-grow-1" id="btn-payment-tarjeta" onclick="seleccionarPago('tarjeta')">Tarjeta</button>
              <button class="btn btn-outline-secondary flex-grow-1" id="btn-payment-transferencia" onclick="seleccionarPago('transferencia')">Transferencia</button>
            </div>

            <!-- Campo dinámico para monto recibido y vuelto -->
            <div id="efectivo-section" style="display:none;" class="mb-3">
              <label for="monto-recibido" class="form-label fw-semibold">Monto recibido:</label>
              <input type="number" id="monto-recibido" class="form-control" placeholder="Ej: 5000" oninput="calcularVuelto()">
              <p class="mt-2 mb-0 fw-bold">Vuelto: $<span id="vuelto">0.00</span></p>
            </div>

            <button class="btn btn-pay w-100 py-2 text-lg font-bold" id="btn-finalize-sale">FINALIZAR VENTA</button>
            <button class="btn btn-outline-danger w-100 mt-2" id="btn-clear-cart">Limpiar Carrito</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal cantidad -->
    <div class="modal fade" id="modalCantidad" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Agregar producto</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p id="nombreProducto"></p>
            <input type="number" id="cantidad" class="form-control" min="0.1" step="0.1" placeholder="Cantidad en kg">
            <input type="hidden" id="precioProducto">
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button class="btn btn-primary" onclick="agregarAlCarrito()">Agregar</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
