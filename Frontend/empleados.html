<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Empleados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar p-3">
    <h2 class="text-2xl font-bold mb-4 text-center">🥩 Carnicería</h2>
    <nav class="flex flex-col gap-2">
      <a href="index.html">💰 TPV</a>
      <a href="stock.html">📦 Stock</a>
      <a href="movimientos.html">💸 Movimientos Caja</a>
      <a href="inicio_cierre.html">🔐 Apertura / Cierre</a>
      <a href="empleados.html" class="active">👥 Empleados</a>
      <a href="sueldos.html">🧾 Sueldos</a>
      <a href="resumen.html">📊 Resumen</a>
    </nav>
  </aside>

  <main class="main-content">
    <h1 class="text-3xl font-bold mb-4">👥 Gestión de Empleados</h1>

    <!-- Añadir empleado -->
    <div class="card shadow mb-4">
      <div class="card-header bg-primary text-white fw-bold">Agregar Nuevo Empleado</div>
      <div class="card-body">
        <form id="empleado-form">
          <div class="row g-3">
            <div class="col-md-5">
              <label>Nombre y Apellido</label>
              <input type="text" id="nombre" class="form-control" required>
            </div>
            <div class="col-md-5">
              <label>Puesto</label>
              <input type="text" id="puesto" class="form-control" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button class="btn btn-primary w-100">Agregar</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Asistencia -->
    <div class="card shadow mb-4">
      <div class="card-header bg-success text-white fw-bold">Marcar Asistencia</div>
      <div class="card-body">
        <form id="asistencia-form">
          <div class="row g-3">
            <div class="col-md-6">
              <label>Empleado</label>
              <select id="empleado-select" class="form-select" required></select>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button class="btn btn-success w-100">Marcar Presente</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla empleados -->
    <div class="card shadow">
      <div class="card-header bg-dark text-white fw-bold">Lista de Empleados</div>
      <div class="card-body">
        <table class="table table-striped">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Puesto</th>
              <th>Última Asistencia</th>
            </tr>
          </thead>
          <tbody id="tabla-empleados">
            <tr><td colspan="4" class="text-center text-muted">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', cargarEmpleados);

    async function cargarEmpleados() {
      const empleados = await apiCall('empleados/');
      const tabla = document.getElementById('tabla-empleados');
      const select = document.getElementById('empleado-select');
      tabla.innerHTML = '';
      select.innerHTML = '<option value="">Seleccionar empleado</option>';
      
      empleados.forEach(e => {
        tabla.innerHTML += `
          <tr>
            <td>${e.id}</td>
            <td>${e.nombre}</td>
            <td>${e.puesto}</td>
            <td>${e.ultima_asistencia ? e.ultima_asistencia : '—'}</td>
          </tr>`;
        select.innerHTML += `<option value="${e.id}">${e.nombre}</option>`;
      });
    }

    document.getElementById('empleado-form').addEventListener('submit', async e => {
      e.preventDefault();
      await apiCall('empleados/', 'POST', { nombre: nombre.value, puesto: puesto.value });
      nombre.value = ''; puesto.value = '';
      cargarEmpleados();
    });

    document.getElementById('asistencia-form').addEventListener('submit', async e => {
      e.preventDefault();
      const id = empleado-select.value;
      await apiCall(`asistencias/${id}`, 'POST');
      alert('Asistencia registrada');
      cargarEmpleados();
    });
  </script>
</body>
</html>
