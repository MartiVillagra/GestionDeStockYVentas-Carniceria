<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Sueldos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar p-3">
    <h2 class="text-2xl font-bold mb-4 text-center">🥩 Carnicería</h2>
    <nav class="flex flex-col gap-2">
      <a href="index.html">💰 TPV</a>
      <a href="stock.html">📦 Stock</a>
      <a href="movimientos.html">💸 Movimientos Caja</a>
      <a href="inicio_cierre.html">🔐 Apertura / Cierre</a>
      <a href="empleados.html">👥 Empleados</a>
      <a href="sueldos.html" class="active">🧾 Sueldos</a>
      <a href="resumen.html">📊 Resumen</a>
    </nav>
  </aside>

  <main class="main-content">
    <h1 class="text-3xl font-bold mb-4">🧾 Gestión de Sueldos</h1>

    <!-- Registrar pago -->
    <div class="card shadow mb-4">
      <div class="card-header bg-warning fw-bold">Registrar Pago de Sueldo</div>
      <div class="card-body">
        <form id="sueldo-form">
          <div class="row g-3">
            <div class="col-md-4">
              <label>Empleado</label>
              <select id="empleado-sueldo" class="form-select" required></select>
            </div>
            <div class="col-md-3">
              <label>Monto ($)</label>
              <input type="number" id="monto" class="form-control" step="0.01" required>
            </div>
            <div class="col-md-3">
              <label>Método de pago</label>
              <select id="metodo" class="form-select">
                <option>Efectivo</option>
                <option>Transferencia</option>
              </select>
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button class="btn btn-warning w-100">Registrar</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Historial de pagos -->
    <div class="card shadow">
      <div class="card-header bg-dark text-white fw-bold">Historial de Sueldos</div>
      <div class="card-body">
        <table class="table table-striped">
          <thead class="table-dark">
            <tr>
              <th>Fecha</th>
              <th>Empleado</th>
              <th>Método</th>
              <th>Monto</th>
            </tr>
          </thead>
          <tbody id="tabla-sueldos">
            <tr><td colspan="4" class="text-center text-muted">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="js/index.js"></script>
</body>
</html>
