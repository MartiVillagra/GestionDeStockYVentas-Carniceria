<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnicería - Gestión de Stock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-bg p-3 shadow-md">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="text-xl font-bold text-white mb-0">🥩 Gestión de Stock</h1>
            <div>
                <a href="index.html" class="btn btn-sm btn-outline-light me-2">TPV</a>
                <a href="cierre.html" class="btn btn-sm btn-light">Caja</a>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <h2 class="mb-4 text-2xl font-bold">Listado de Productos</h2>
        
        <button class="btn btn-carne mb-3" data-bs-toggle="modal" data-bs-target="#addProductModal">
            + Añadir Nuevo Producto
        </button>

        <!-- Tabla de Productos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio/Kg/u</th>
                                <th>Tipo Venta</th>
                                <th>Stock (Kg)</th>
                                <th>Stock (Uds)</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="stock-table-body">
                            <!-- Datos se cargarán con JS -->
                            <tr><td colspan="8" class="text-center">Cargando datos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para Añadir/Editar Producto -->
    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addProductModalLabel">Añadir Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="product-form">
                        <div class="mb-3"><label for="nombre">Nombre</label><input type="text" class="form-control" id="nombre" required></div>
                        <div class="mb-3"><label for="categoria">Categoría</label><input type="text" class="form-control" id="categoria" required></div>
                        <div class="mb-3"><label for="precio">Precio Venta ($)</label><input type="number" step="0.01" class="form-control" id="precio" required></div>
                        <div class="mb-3">
                            <label for="tipo_venta">Tipo de Venta</label>
                            <select class="form-select" id="tipo_venta" required>
                                <option value="Kilo">Kilo</option>
                                <option value="Unidad">Unidad</option>
                            </select>
                        </div>
                        <div class="mb-3"><label for="stock_kilos">Stock Inicial (Kg)</label><input type="number" step="0.01" class="form-control" id="stock_kilos" value="0.00"></div>
                        <div class="mb-3"><label for="stock_unidades">Stock Inicial (Uds)</label><input type="number" step="0.01" class="form-control" id="stock_unidades" value="0.00"></div>
                        <div class="mb-3"><label for="peso_unidad_kg">Peso por Unidad (kg) - *Solo si la venta es por peso pero stock por unidad*</label><input type="number" step="0.001" class="form-control" id="peso_unidad_kg" value="0.000"></div>
                        <button type="submit" class="btn btn-carne w-full">Guardar Producto</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Lógica de Stock (Similar a app.js, pero enfocada en CRUD de Productos)
        document.addEventListener('DOMContentLoaded', loadProducts);

        async function loadProducts() {
            const products = await apiCall('productos/');
            const tableBody = document.getElementById('stock-table-body');
            tableBody.innerHTML = '';

            if (products && !products.error) {
                products.forEach(p => {
                    const row = tableBody.insertRow();
                    row.insertCell(0).textContent = p.id_producto;
                    row.insertCell(1).textContent = p.nombre_producto;
                    row.insertCell(2).textContent = p.categoria;
                    row.insertCell(3).textContent = `$${parseFloat(p.precio_kilo).toFixed(2)}`;
                    row.insertCell(4).textContent = p.tipo_venta;
                    row.insertCell(5).textContent = parseFloat(p.stock_kilos).toFixed(2);
                    row.insertCell(6).textContent = parseFloat(p.stock_unidades).toFixed(2);
                    row.insertCell(7).innerHTML = '<button class="btn btn-sm btn-warning me-2">Editar</button>';
                });
            } else {
                tableBody.innerHTML = '<tr><td colspan="8" class="text-center text-red-500">Error al cargar productos. Asegúrese que el Backend está corriendo.</td></tr>';
            }
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const productData = {
                nombre_producto: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                precio_kilo: parseFloat(document.getElementById('precio').value),
                tipo_venta: document.getElementById('tipo_venta').value,
                stock_kilos: parseFloat(document.getElementById('stock_kilos').value),
                stock_unidades: parseFloat(document.getElementById('stock_unidades').value),
                peso_unidad_kg: parseFloat(document.getElementById('peso_unidad_kg').value)
            };

            const response = await apiCall('productos/', 'POST', productData);
            if (response && !response.error) {
                alert(`Producto ${response.nombre_producto} creado con éxito!`);
                loadProducts(); // Recargar la tabla
                const modal = bootstrap.Modal.getInstance(document.getElementById('addProductModal'));
                modal.hide();
                document.getElementById('product-form').reset();
            } else {
                alert("Error al crear el producto.");
            }
        });
    </script>
</body>
</html>
