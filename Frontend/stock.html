<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock - Carnicería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar p-3">
        <h2 class="text-2xl font-bold mb-4 text-center">🥩 Carnicería</h2>
        <nav class="flex flex-col gap-2">
            <a href="index.html">💰 TPV</a>
            <a href="stock.html" class="active">📦 Stock</a>
            <a href="movimientos.html">💸 Movimientos Caja</a>
            <a href="inicio_cierre.html">🔐 Apertura / Cierre</a>
            <a href="empleados.html">👥 Empleados</a>
            <a href="sueldos.html">🧾 Sueldos</a>
            <a href="resumen.html">📊 Resumen</a>
        </nav>
    </aside>

    <main class="main-content">
        <h1 class="text-3xl font-bold mb-4">📦 Gestión de Stock</h1>

        <button class="btn btn-danger mb-3" data-bs-toggle="modal" data-bs-target="#addProductModal">+ Añadir
            Producto
        </button>

        <div class="card shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock Gr</th>
                            </tr>
                        </thead>
                        <tbody id="stock-table-body">
                            <tr>
                                <td colspan="8" class="text-center">Cargando datos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Añadir Producto</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="product-form">
                        <input type="hidden" id="edit-id">
                        <div class="mb-3"><label>Nombre</label><input type="text" id="nombre" class="form-control" required></div>
                        <div class="mb-3"><label>Categoría</label><select id="categoria-select" class="form-select" required></select></div>
                        <div class="mb-3"><label>Precio(gr/$)</label><input type="number" step="0.01" id="precio" class="form-control" required></div>
                        <div class="mb-3">
                            <div class="mb-3"><label>Stock Gr</label><input type="number" step="0.01" id="stock_kilos"
                                    class="form-control"></div>
                            <button type="submit" class="btn btn-danger w-100">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Producto</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="product-form">
                        <input type="hidden" id="edit-id">
                        <div class="mb-3"><label>Nombre</label><input type="text" id="nombre" class="form-control"
                                required></div>
                        <div class="mb-3"><label>Categoría</label><input type="text" id="categoria" class="form-control"
                                required></div>
                        <div class="mb-3"><label>Precio ($)</label><input type="number" step="0.01" id="precio"
                                class="form-control" required></div>
                        <div class="mb-3">
                            <div class="mb-3"><label>Stock Gr</label><input type="number" step="0.01" id="stock_kilos"
                                    class="form-control"></div>
                            <button type="submit" class="btn btn-danger w-100">Guardar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>

</body>
</html>
